# Slurm configuration for the local single-node simulation.
ClusterName=dsa-sim
SlurmctldHost=slurm
AuthType=auth/munge
CryptoType=crypto/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
MpiDefault=none
ProctrackType=proctrack/pgid
ReturnToService=2
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
WaitTime=0
SchedulerType=sched/backfill
# No slurmdbd in this simulation; disable accounting so job submission does
# not require associations.
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none
PriorityType=priority/basic
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
# cgroup plugins are not usable inside a container; use pgid tracking and no
# task plugin.
TaskPlugin=task/none
NodeName=slurm CPUs=8 RealMemory=60000 State=UNKNOWN
PartitionName=girdercompute Nodes=ALL Default=YES MaxTime=INFINITE State=UP
# Slurm daemon debug; raise to debug5 for troubleshooting
SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/logs/slurm-ctld.log
SlurmdLogFile=/logs/slurmd.log
