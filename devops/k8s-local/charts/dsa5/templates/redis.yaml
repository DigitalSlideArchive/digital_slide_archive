{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsa5.fullname" . }}-redis
  labels:
    {{- include "dsa5.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dsa5.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "dsa5.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # Match the compose reference's cache eviction behavior.
          args:
            - "--maxmemory"
            - "4096MB"
            - "--maxmemory-policy"
            - "volatile-lru"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - "-p"
                - "6379"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - "-p"
                - "6379"
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dsa5.fullname" . }}-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dsa5.fullname" . }}-redis
  labels:
    {{- include "dsa5.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.redis.storageClass }}
  storageClassName: {{ .Values.persistence.redis.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.redis.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsa5.fullname" . }}-redis
  labels:
    {{- include "dsa5.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "dsa5.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
